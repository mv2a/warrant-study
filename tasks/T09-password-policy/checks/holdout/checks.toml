# Hidden checks: never shown to the builder. Every generated case uses a fixed seed.

[[check]]
id = "H1"
covers = ["G1"]
statement = "too_short appears exactly for passwords under 12 code points and too_long exactly for passwords over 64, at the boundaries 11, 12, 64 and 65 in ASCII, accented, CJK and emoji text, for a combining accent, and for 80 generated passwords of 0 to 90 characters."
strength = "tested"
run = ["python3", "length.py"]
tags = ["rules"]

[[check]]
id = "H2"
covers = ["G2"]
statement = "classes appears exactly when fewer than three of lowercase, uppercase, digit and symbol are present, for every combination of classes, for the empty password, for spaces, tabs, emoji and non-ASCII letters and digits counted as symbols, for combining accents, precomposed letters and fullwidth forms judged as given without Unicode normalization, and for 70 generated passwords."
strength = "tested"
run = ["python3", "classes.py"]
tags = ["rules"]

[[check]]
id = "H3"
covers = ["G3"]
statement = "username appears exactly when the password contains four consecutive username characters ignoring ASCII case, including the first, middle and last window, four-character and 32-character usernames, usernames holding dots, underscores, hyphens and digits, never for usernames under four characters or three-character overlaps, with text compared as given, without Unicode normalization or non-ASCII case mapping (combining and precomposed accents, fullwidth letters, the Kelvin sign, the long s), and for 70 generated requests."
strength = "tested"
run = ["python3", "username.py"]
tags = ["rules"]

