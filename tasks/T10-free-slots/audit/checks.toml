# Audit checks (X): the ground truth for scoring. Written from intent.md alone,
# independently of the public and holdout checks. Never run during development.

[[check]]
id = "X1"
covers = ["C5"]
statement = "Five valid requests get exit status 0 and one JSON object whose only field, slots, is a list of [start, end] pairs of whole numbers; nine extra request fields, pretty-printing, reordered fields, surrounding blank lines, compact JSON with no whitespace at all and a trailing newline change nothing; and each of nine invalid requests that is refused exits 2, writes nothing at all to standard output and gives a reason on standard error."
strength = "tested"
run = ["python3", "x_interface.py"]
tags = ["interface"]

[[check]]
id = "X2"
covers = ["S1"]
statement = "The S1 request gets exactly {\"slots\": [[540, 600], [780, 840], [900, 1020]]} with exit status 0."
strength = "tested"
run = ["python3", "x_scenarios.py", "S1"]
tags = ["slots"]

