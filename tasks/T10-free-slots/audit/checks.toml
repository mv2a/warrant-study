[[check]]
id = "X5"
covers = ["G1"]
statement = "For 33 hand-made and 70 generated requests (seed 10102026) with 1 to 601 people, some with no busy intervals, and quorums from one person to everyone, the minutes covered by the slots are exactly the minutes of the working hours when at least quorum of the listed people are free."
strength = "tested"
run = ["python3", "x_enough_free.py"]
tags = ["slots"]

[[check]]
id = "X6"
covers = ["G2"]
statement = "Free stretches lasting exactly min_length minutes are returned and one minute short are not, for 26 hand-made requests (including min_length 1, the whole day, 1441, 100000 and stretches shaped by a quorum below the whole group) and 80 generated threshold cases with varied quorums (seed 424277), and a request with nothing long enough gets an empty list."
strength = "tested"
run = ["python3", "x_min_length.py"]
tags = ["slots"]

[[check]]
id = "X7"
covers = ["G3"]
statement = "For 16 hand-made requests, including stretches during which the people who are free change under a quorum, and 80 generated requests with varied quorums (seed 881357), each free stretch comes back as one whole slot, with no duplicates, pieces, overlaps or touching slots, listed earliest first, exactly as the audit model gives."
strength = "tested"
run = ["python3", "x_whole_slots.py"]
tags = ["slots"]

[[check]]
id = "X8"
covers = ["C1"]
statement = "Intervals run from start up to but not including end and last end - start minutes: touching meetings leave no gap, a person is free again at the minute their meeting ends when a quorum is counted, a one-minute gap or meeting counts, 40-minute stretches pass min_length 40 and fail 41, minutes 0 and 1440 are the day's ends, checked on 23 hand-made and 50 generated grid-aligned requests with varied quorums (seed 5312026)."
strength = "tested"
run = ["python3", "x_minutes.py"]
tags = ["slots"]

[[check]]
id = "X9"
covers = ["C2"]
statement = "Unsorted, overlapping, nested and repeated busy intervals give the hand-worked answer in 17 requests, including quorum requests where one person's overlapping or repeated intervals count as one busy person and the same meeting for two people counts as two, and 28 generated requests with varied quorums (seed 314159) get the same answer after each rewrite that keeps every person's covered time the same: shuffled, reversed, repeats and nested pieces added to the same person, and intervals split into overlapping pieces."
strength = "tested"
run = ["python3", "x_order.py"]
tags = ["slots"]

[[check]]
