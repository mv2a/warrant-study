# Hidden checks: never shown to the builder.

[[check]]
id = "H1"
covers = ["G1"]
statement = "With everyone required, a single person's meeting blocks the group wherever that person is listed, in groups of 2, 3, 4, 5, 7 and 10 people, and groups of 1 to 12 people each busy for half of a different hour leave only the gaps free; a meeting held by 1 to all of a group of 3, 5 or 8 leaves its time free exactly when at least quorum others are free, for every quorum; people with empty calendars count toward the quorum; seven hand-worked quorum cases such as a staircase of overlapping meetings give the stated slots; and 70 generated groups of 3 to 9 people with varied quorums match a minute-by-minute count."
strength = "tested"
run = ["python3", "people.py"]
tags = ["slots"]

[[check]]
id = "H2"
covers = ["G2"]
statement = "For min_length values of 1, 2, 15, 30, 45, 60, 90 and 120, free stretches one minute short are left out and stretches of exactly min_length or one minute more are returned, at the start, middle and end of the working hours; a fully free day is returned at exactly its length and not one minute more; stretches shaped by a quorum of 1 of 2 people follow the same threshold; no long enough stretch gives an empty list; and 60 generated requests match a minute-by-minute count."
strength = "tested"
run = ["python3", "length.py"]
tags = ["slots"]

