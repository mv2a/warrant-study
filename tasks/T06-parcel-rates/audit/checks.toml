id = "X04"
covers = ["G2"]
statement = "In every zone, parcels billed on their actual weight of 2 to 10,000 g get base_cents equal to the table price of the lightest bracket that holds that weight, each bracket including its upper limit: on both sides of 500, 1,000, 2,000, 5,000 and 10,000 g and within each bracket (80 requests)."
strength = "tested"
run = ["python3", "brackets.py"]
