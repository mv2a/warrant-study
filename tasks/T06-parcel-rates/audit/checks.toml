# Audit checks (X): written from intent.md alone, independently of the public and hidden checks.
# The ground truth for scoring; never run during development.
#
# The study counts every promise that a failing X check covers as broken, so each check judges
# only what the promises it covers decide (see _audit.py):
# - C1 judges the interface strictly: status 0 with exactly one JSON object holding the four
#   JSON-integer fields and total = base + surcharge, or status 2 with nothing at all on standard
#   output, and no other status. Whether a request should be priced is not C1's business.
# - G1 to G4 and S1 to S3 judge the values of the response fields they define. A refused parcel
#   that sits exactly on a carrying limit is left to C2.
# - C2, C3 and S4 judge priced (status 0 with a JSON object) or refused (status 2, no price).
# G2 and G3 are judged on parcels billed on their actual weight and not oversize. How the dimensional
# weight is rounded never decides whether a parcel is carried (see _audit.py), so the C2 checks judge
# every parcel, including light ones whose dimensional weight is exactly 30,000 g.

[[check]]
id = "X01"
covers = ["C1"]
statement = "Four plain valid requests and one request sent in five JSON layouts (indented, compact, wrapped in whitespace, keys in two other orders) exit 0 with exactly one JSON object holding the integer fields billable_g, base_cents, surcharge_cents and total_cents, total equal to base plus surcharge, every layout getting the same answer; and 14 requests of every refused kind (not JSON, empty, a list, a missing field, bad zones, bad weights and sides, too heavy, too long, too big) either exit 0 with such an object or exit 2 with nothing at all on standard output (23 requests, plus 6 for the layout comparison)."
strength = "tested"
run = ["python3", "interface.py"]
tags = ["interface"]

[[check]]
id = "X02"
covers = ["C1"]
statement = "Six sets of extra request fields, including fields named like the answer's fields, differently cased field names, nulls, lists and nested objects, change nothing: three priced parcels and one parcel over 30,000 g each get exactly the same status and output with them as the command gives without them (28 requests)."
strength = "tested"
run = ["python3", "extra_fields.py"]
tags = ["interface"]

[[check]]
id = "X03"
covers = ["G1"]
statement = "billable_g is the greater of the actual weight and length x width x height / 5 rounded up to a whole gram, in 24 hand-worked parcels (remainders of 1 to 4, exact multiples, ties, and rounding that pushes a parcel into the next bracket or over 10,000 g) and in every side order of three parcels (42 requests); and in every zone, 13 light parcels billed on a dimensional weight of 500, 501, 1000, 1001, 2000, 2001, 5000, 5001, 10000, 10001, 11000, 11001 or 30000 g get the same base_cents as a small parcel of that actual weight and the same oversize status (52 pairs)."
strength = "tested"
run = ["python3", "dimweight.py"]
tags = ["money"]

