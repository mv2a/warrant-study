# Audit checks (X): the ground truth for scoring, written from intent.md alone.
# Never shown to the builder and never run during development.

[[check]]
id = "X1"
covers = ["C1"]
statement = "Twenty-eight valid loans each exit 0 with one object holding exactly payment_cents, total_interest_cents and rows, every row holding exactly whole-number month, payment_cents, interest_cents, principal_cents and balance_cents with months numbered 1, 2, 3, ...; one loan written four ways (key order, spacing, newlines) gets the same schedule; one loan sent five times with fields beyond the three (text, true, null, a fraction, a nested object holding months, and fields named payment_cents, total_interest_cents and rows) gets exactly the schedule it gets without them; and three refused requests exit 2 with an empty standard output."
strength = "tested"
run = ["python3", "interface.py"]
tags = ["interface"]

[[check]]
id = "X2"
covers = ["G1"]
statement = "For 96 loans at rates above zero, the regular payment equals the exact level payment P*i/(1-(1+i)^-n) rounded up to a whole cent, including 18 loans whose exact level payment is already whole (no cent added), 21 whose exact level payment lies within a millionth of a cent of a whole cent, the range edges, and 45 loans generated with seed 31337."
strength = "tested"
run = ["python3", "payment.py"]
tags = ["money"]

