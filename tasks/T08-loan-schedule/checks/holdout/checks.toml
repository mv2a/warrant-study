[[check]]
id = "H1"
covers = ["C1"]
statement = "Thirty loans, including the smallest and largest allowed, each get one JSON object with exactly payment_cents, total_interest_cents and rows, whole numbers only and months numbered 1, 2, 3, even when the request's fields come in another order or pretty-printed; five requests carrying fields beyond the three (text, null, a list, a field named Months, a nested object) get exactly the schedule of the same loan without them; eight refused requests exit with status 2 and write nothing at all on standard output."
