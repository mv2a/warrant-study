# Hidden checks: never shown to the builder.

[[check]]
id = "H1"
covers = ["C1"]
statement = "Across 30 generated logs the output has exactly decisions and clients, one accept or reject per request in order, and one correct per-client count for exactly the clients in the log; an empty log gives empty results; extra fields are ignored; refusals exit 2 with nothing on standard output."
strength = "tested"
run = ["python3", "interface.py"]
tags = ["interface"]

[[check]]
id = "H2"
covers = ["G1"]
statement = "In 40 generated multi-client logs, including names that differ only in case or spaces, every client's decisions are the same as when its requests are replayed alone, and names are never merged."
strength = "tested"
run = ["python3", "clients.py"]
tags = ["limiter"]

[[check]]
id = "H3"
covers = ["G2"]
statement = "A bucket is full before a client's first request at 0 ms, 1 ms, 250 ms or a day in, for bursts of 1 to 100; after long quiet periods at most burst requests are accepted at one instant; and tokens that overflow a full bucket are lost."
strength = "tested"
run = ["python3", "burst.py"]
tags = ["limiter"]

