# Audit checks (X): written from intent.md alone, independently of the visible and hidden
# checks. They are the ground truth for scoring and never run during development.

[[check]]
id = "X1"
covers = ["C3"]
statement = "Fifteen valid requests, five of them also sent pretty-printed with the keys reordered for the same answer, exit 0 and write one JSON object holding exactly a numeric percent between 0 and 100 with at most one decimal place and one of the seven letters, and each of five invalid requests that the command does not grade exits 2 with nothing but whitespace on standard output."
strength = "tested"
run = ["python3", "interface.py"]
tags = ["interface"]

[[check]]
id = "X2"
covers = ["C3"]
statement = "Adding any of nine sets of unknown top-level fields (including extra_credit, curve, weights, percent and letter) or any of four sets of unknown fields inside every homework object to three valid requests leaves the exit status and answer exactly as they were without them."
strength = "tested"
run = ["python3", "extra_fields.py"]
tags = ["interface"]

