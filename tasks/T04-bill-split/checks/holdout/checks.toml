# Hidden checks: never shown to the builder.

[[check]]
id = "H1"
covers = ["G1"]
statement = "For 100 bills, including 20 fixed single-item cases, most on or next to an exact half-cent tip, and 40 bills whose tip ends in exactly half a cent, subtotal_cents is the sum of the item prices, tip_cents is tip_percent of it rounded to the nearest cent with halves up, and total_cents is their sum."
strength = "tested"
run = ["python3", "tip.py"]
tags = ["money"]

