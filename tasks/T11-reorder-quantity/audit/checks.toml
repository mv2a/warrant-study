# Audit checks (X): the ground truth for scoring. Written from intent.md alone, independently of
# the holdout checks, the reference and the broken implementations. Never run during development.

[[check]]
id = "X1"
covers = ["C1"]
statement = "Three valid requests exit 0 with one object holding exactly orders (a list), total_cost_cents and budget_left_cents (integers), each order holding exactly sku (one of the request's strings) and the integers wanted, quantity and cost_cents, and three plainly invalid requests (not JSON, no products, a JSON list) exit 2 with nothing on standard output."
strength = "tested"
run = ["python3", "interface.py"]
tags = ["interface"]

[[check]]
id = "X2"
covers = ["C1"]
statement = "Extra fields at the top level and in every product, including ones holding negative, fractional, null or empty values, are ignored, and pretty-printed, reordered or tab-indented input gets the same plan as the plain request."
strength = "tested"
run = ["python3", "ignored_fields.py"]
tags = ["interface"]

[[check]]
id = "X3"
covers = ["G1"]
statement = "For 16 products in packs of one, wanted equals daily demand times lead time plus safety stock minus on hand minus on order, and 0 when that is zero or less: needs landing exactly on the target, one unit above and below it, stock on order alone, zero demand, zero lead time and zero safety stock."
strength = "tested"
run = ["python3", "target.py"]
tags = ["arithmetic"]

[[check]]
id = "X4"
covers = ["G1"]
statement = "150 generated products in packs of one (seed 61903), about two fifths of them built with stock exactly on or one or two units either side of the target, get wanted equal to their units needed."
